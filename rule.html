<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการประกาศ - Witch Yu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-plum:#180a2e;
    --royal-purple:#3a1466;
    --gold:#e7c675;
    --gold-soft:#caa75d;
    --panel:#231044;
    --panel-line: rgba(231,198,117,0.35);
    --ok:#3fae62;
    --full:#c94b4b;
    --text-soft: rgba(240,232,255,0.75);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(90,40,140,0.55), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(60,20,100,0.6), transparent 55%),
      var(--deep-plum);
    font-family:'Sarabun', sans-serif;
    color:#f2ebff;
    padding: 28px 16px 60px;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
  }
  .top{
    text-align:center;
    margin-bottom:22px;
  }
  .top .eyebrow{
    font-size:13px;
    letter-spacing:1px;
    color:var(--gold-soft);
  }
  .top h1{
    font-family:'Charmonman', cursive;
    font-size:44px;
    margin:2px 0 0;
    color:var(--gold);
    text-shadow:0 0 18px rgba(231,198,117,0.35);
  }

  .card{
    background:linear-gradient(180deg, rgba(58,20,102,0.55), rgba(24,10,46,0.75));
    border:1px solid var(--panel-line);
    border-radius:22px;
    padding:22px 20px;
    margin-bottom:18px;
    backdrop-filter: blur(2px);
  }
  .card h2{
    font-size:16px;
    margin:0 0 14px;
    color:var(--gold);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  .mode-toggle{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  .mode-toggle button{
    flex:1;
    padding:12px 8px;
    border-radius:14px;
    border:1px solid var(--panel-line);
    background:rgba(255,255,255,0.03);
    color:var(--text-soft);
    font-family:'Sarabun',sans-serif;
    font-size:14.5px;
    cursor:pointer;
    transition: all .18s ease;
  }
  .mode-toggle button.active{
    background:linear-gradient(180deg, rgba(231,198,117,0.22), rgba(231,198,117,0.08));
    border-color:var(--gold);
    color:var(--gold);
  }

  label{
    display:block;
    font-size:13.5px;
    color:var(--text-soft);
    margin:16px 0 6px;
  }
  input[type=text], input[type=date], textarea, input[type=time]{
    width:100%;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:11px 13px;
    color:#f6f1ff;
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    outline:none;
  }
  input:focus, textarea:focus{
    border-color:var(--gold);
  }
  textarea{
    resize:vertical;
    min-height:110px;
    line-height:1.6;
  }

  .row-date-range{
    display:flex;
    gap:10px;
  }
  .row-date-range > div{flex:1;}

  .slot{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:8px 10px;
  }
  .slot input[type=time]{
    flex:1;
    border:none;
    background:transparent;
    padding:6px 4px;
  }
  .slot select{
    border:1px solid var(--panel-line);
    background:rgba(255,255,255,0.04);
    color:#f2ebff;
    border-radius:9px;
    padding:8px 10px;
    font-family:'Sarabun',sans-serif;
    font-size:14px;
  }
  .slot .remove{
    border:none;
    background:transparent;
    color:#c98686;
    font-size:18px;
    cursor:pointer;
    padding:2px 6px;
  }

  .add-slot{
    width:100%;
    padding:11px;
    border-radius:12px;
    border:1px dashed var(--panel-line);
    background:transparent;
    color:var(--gold-soft);
    font-family:'Sarabun',sans-serif;
    font-size:14px;
    cursor:pointer;
    margin-top:4px;
  }
  .add-slot:hover{ border-color:var(--gold); color:var(--gold); }

  .hint{
    font-size:12.5px;
    color:rgba(240,232,255,0.45);
    margin-top:6px;
  }

  .submit-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:none;
    background:linear-gradient(180deg, #f2d896, var(--gold-soft));
    color:#241143;
    font-family:'Sarabun',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(231,198,117,0.22);
    margin-top:6px;
  }
  .submit-btn:active{ transform: translateY(1px); }

  .saved-msg{
    text-align:center;
    font-size:13px;
    color:var(--ok);
    margin-top:10px;
    min-height:16px;
  }

  fieldset{border:none;padding:0;margin:0;}
  .section{ display:none; }
  .section.active{ display:block; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="eyebrow">Witch Yu · หลังบ้าน</div>
    <h1>ตั้งค่าประกาศ</h1>
  </div>

  <div class="card">
    <h2><span class="dot"></span>รูปแบบประกาศ</h2>
    <div class="mode-toggle">
      <button type="button" id="btn-mode-closed" class="active">ปิดรับคิว</button>
      <button type="button" id="btn-mode-queue">คิวจอง</button>
    </div>
    <p class="hint">เลือก "ปิดรับคิว" เมื่อแม่หมอไม่สะดวกดูดวงช่วงนั้น หรือเลือก "คิวจอง" เพื่อโชว์สถานะคิวแต่ละช่วงเวลา</p>
  </div>

  <!-- CLOSED MODE -->
  <div class="card section active" id="section-closed">
    <h2><span class="dot"></span>ช่วงวันที่ปิดรับ</h2>
    <div class="row-date-range">
      <div>
        <label>ตั้งแต่วันที่</label>
        <input type="date" id="closed-date-from">
      </div>
      <div>
        <label>ถึงวันที่</label>
        <input type="date" id="closed-date-to">
      </div>
    </div>

    <label>ข้อความประกาศ</label>
    <textarea id="closed-message">❌แม่หมอหยุดนะคะ❌
❌ไม่มีการรับคิวและจองคิวใดๆ❌
แม่หมอติดธุระยาว
เลยอาจจะไม่ว่างมาดูให้ลูกดวง
ขออภัยด้วยนะคะ แม่หมอจะรีบเคลียร์ธุระ
และกลับมาเปิดจองค่ะ</textarea>
    <p class="hint">ขึ้นบรรทัดใหม่ได้ตามต้องการ ระบบจะแสดงผลตามที่พิมพ์ทุกบรรทัด</p>
  </div>

  <!-- QUEUE MODE -->
  <div class="card section" id="section-queue">
    <h2><span class="dot"></span>วันที่ของคิว</h2>
    <label>วันที่ (พ.ศ.)</label>
    <input type="text" id="queue-date" placeholder="เช่น 18 กันยายน 2569">

    <label>หัวข้อประกาศ</label>
    <textarea id="queue-title" style="min-height:60px;">อัพเดทนะคะลูกดวง
เหลือคิวช่วงนี้ค่ะ</textarea>

    <label>ช่วงเวลาคิว</label>
    <div id="slot-list"></div>
    <button type="button" class="add-slot" id="add-slot">+ เพิ่มช่วงเวลา</button>
  </div>

  <button type="button" class="submit-btn" id="finish-btn">เสร็จสิ้น</button>
  <div class="saved-msg" id="saved-msg"></div>

</div>

<script>
  const btnClosed = document.getElementById('btn-mode-closed');
  const btnQueue = document.getElementById('btn-mode-queue');
  const sectionClosed = document.getElementById('section-closed');
  const sectionQueue = document.getElementById('section-queue');
  let currentMode = 'closed';

  function setMode(mode){
    currentMode = mode;
    btnClosed.classList.toggle('active', mode==='closed');
    btnQueue.classList.toggle('active', mode==='queue');
    sectionClosed.classList.toggle('active', mode==='closed');
    sectionQueue.classList.toggle('active', mode==='queue');
  }
  btnClosed.addEventListener('click', ()=>setMode('closed'));
  btnQueue.addEventListener('click', ()=>setMode('queue'));

  // ---- queue slot rows ----
  const slotList = document.getElementById('slot-list');

  function addSlotRow(time = '', status = 'ว่าง'){
    const row = document.createElement('div');
    row.className = 'slot';
    row.innerHTML = `
      <input type="time" value="${time}">
      <select>
        <option value="ว่าง" ${status==='ว่าง' ? 'selected' : ''}>คิวว่าง</option>
        <option value="จอง" ${status==='จอง' ? 'selected' : ''}>จองแล้ว</option>
      </select>
      <button type="button" class="remove" title="ลบ">✕</button>
    `;
    row.querySelector('.remove').addEventListener('click', ()=> row.remove());
    slotList.appendChild(row);
  }

  document.getElementById('add-slot').addEventListener('click', ()=> addSlotRow());

  // seed with a few example rows to match the sample
  addSlotRow('20:00','จอง');
  addSlotRow('21:00','จอง');
  addSlotRow('21:30','จอง');
  addSlotRow('22:00','ว่าง');
  addSlotRow('22:30','ว่าง');

  // ---- save + redirect ----
  document.getElementById('finish-btn').addEventListener('click', ()=>{
    let payload = { mode: currentMode, savedAt: new Date().toISOString() };

    if(currentMode === 'closed'){
      payload.dateFrom = document.getElementById('closed-date-from').value;
      payload.dateTo = document.getElementById('closed-date-to').value;
      payload.message = document.getElementById('closed-message').value;
    } else {
      payload.date = document.getElementById('queue-date').value;
      payload.title = document.getElementById('queue-title').value;
      payload.slots = Array.from(slotList.querySelectorAll('.slot')).map(row=>{
        return {
          time: row.querySelector('input[type=time]').value,
          status: row.querySelector('select').value
        };
      }).filter(s => s.time);
    }

    localStorage.setItem('witchyu_announcement', JSON.stringify(payload));

    const msg = document.getElementById('saved-msg');
    msg.textContent = 'บันทึกแล้ว กำลังไปหน้าแสดงผล...';
    setTimeout(()=>{ window.location.href = 'notify.html'; }, 500);
  });
</script>
</body>
</html>
